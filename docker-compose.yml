services:
  portainer-mcp:
    image: ghcr.io/mbay-odw/portainer-mcp:latest
    container_name: portainer-mcp
    restart: unless-stopped
    environment:
      # Portainer connection
      - PORTAINER_URL=${PORTAINER_URL}
      - PORTAINER_TOKEN=${PORTAINER_TOKEN}
      # Transport / listen
      - MCP_TRANSPORT=sse
      - PORT=8000
      # Auth
      - MCP_API_KEY=${MCP_API_KEY}
      # Direct internal Authelia URL (recommended) or external via Traefik
      - OIDC_INTROSPECTION_URL=${OIDC_INTROSPECTION_URL:-http://authelia:9091/api/oidc/introspection}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-portainer-mcp}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      # Public Authelia URL – RFC 8414 OAuth Authorization Server Metadata
      - OAUTH_ISSUER=${OAUTH_ISSUER}
      # Public URL of this MCP server – RFC 9728 Protected Resource Metadata
      - MCP_SERVER_URL=${MCP_SERVER_URL:-https://portainer-mcp.${DOMAIN}}
    # Pass --disable-version-check via CMD already; add other flags here if needed.
    # command: ["-disable-version-check", "-read-only"]
    expose:
      - "8000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.portainer-mcp-sse.rule=Host(`portainer-mcp.${DOMAIN}`) && PathPrefix(`/sse`)"
      - "traefik.http.routers.portainer-mcp-sse.entrypoints=websecure"
      - "traefik.http.routers.portainer-mcp-sse.service=portainer-mcp-svc"
      - "traefik.http.routers.portainer-mcp-sse.tls=true"
      - "traefik.http.routers.portainer-mcp-sse.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.portainer-mcp-sse.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file"
      - "traefik.http.routers.portainer-mcp-msg.rule=Host(`portainer-mcp.${DOMAIN}`) && PathPrefix(`/messages`)"
      - "traefik.http.routers.portainer-mcp-msg.entrypoints=websecure"
      - "traefik.http.routers.portainer-mcp-msg.service=portainer-mcp-svc"
      - "traefik.http.routers.portainer-mcp-msg.tls=true"
      - "traefik.http.routers.portainer-mcp-msg.tls.certresolver=mydnschallenge"
      - "traefik.http.routers.portainer-mcp-msg.middlewares=middlewares-rate-limit@file,middlewares-secure-headers@file"
      - "traefik.http.routers.portainer-mcp-wellknown.rule=Host(`portainer-mcp.${DOMAIN}`) && PathPrefix(`/.well-known`)"
      - "traefik.http.routers.portainer-mcp-wellknown.entrypoints=websecure"
      - "traefik.http.routers.portainer-mcp-wellknown.service=portainer-mcp-svc"
      - "traefik.http.routers.portainer-mcp-wellknown.tls=true"
      - "traefik.http.routers.portainer-mcp-wellknown.tls.certresolver=mydnschallenge"
      - "traefik.http.services.portainer-mcp-svc.loadbalancer.server.port=8000"
    networks:
      - traefik

networks:
  traefik:
    external: true
